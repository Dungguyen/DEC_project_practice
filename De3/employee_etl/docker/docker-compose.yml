version: "3.8"

services:

  # ── PostgreSQL database ──────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: employees_postgres
    environment:
      POSTGRES_DB:       employees_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   # dữ liệu bền vững
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── ETL app ─────────────────────────────────────────
  etl:
    build: .
    container_name: employees_etl
    env_file: .env                      # đọc config từ .env
    environment:
      DB_HOST: postgres                 # ghi đè host thành tên service
    depends_on:
      postgres:
        condition: service_healthy      # chờ postgres sẵn sàng rồi mới chạy
    volumes:
      - ./data:/app/data                # mount thư mục data từ host vào container

volumes:
  postgres_data: